version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dss_network
    depends_on:
      - dss_frontend
      - dss_backend

  dss_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dss_frontend
    depends_on:
      - dss_backend
    networks:
      - dss_network

  dss_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dss_backend
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=dss_db
      - DB_PORT=3306
      - DB_DATABASE=dss_project
      - DB_USERNAME=dss_user
      - DB_PASSWORD=dss_password
    depends_on:
      - dss_db
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    networks:
      - dss_network

  dss_db:
    image: mysql:8.0
    container_name: dss_db
    restart: always
    environment:
      MYSQL_DATABASE: dss_project
      MYSQL_USER: dss_user
      MYSQL_PASSWORD: dss_password
      MYSQL_ROOT_PASSWORD: dss_root_password
    ports:
      - "3306:3306"
    volumes:
      - dss_db_data:/var/lib/mysql
    networks:
      - dss_network

networks:
  dss_network:
    driver: bridge

volumes:
  dss_db_data:
  caddy_data:
  caddy_config:
